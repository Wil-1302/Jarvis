# JARVIS: los audífonos Bluetooth siguen siempre en A2DP (alta calidad).
# Sin esto, cuando algo graba del micrófono BT, WirePlumber los pasa a HSP/HFP
# (mono, 16 kHz) y la música suena distorsionada. Jarvis usa el micrófono del portátil.
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}
