# JARVIS — encierro del gateway de OpenClaw (capa 2, ver docs/AISLAMIENTO_OPENCLAW.md).
# Destino: ~/.config/systemd/user/openclaw-gateway.service.d/ (lo copia scripts/sync-brain.sh).
# Afecta al gateway y a todos sus procesos hijos (exec, MCP stdio, skills, el CLI de Claude).
# El prefijo "-" ignora rutas que no existan. %h = $HOME.
# Limitación conocida: systemd-run/systemctl --user por el bus de sesión lo evaden;
# esos comandos requieren aprobación humana en las exec approvals (capa 1).
# ~/.claude y ~/.claude.json NO se bloquean: el runtime claude-cli los necesita (D-008).
[Service]
# Refuerzo e: sin sudo/setuid para nada que lance el gateway.
NoNewPrivileges=yes
RestrictSUIDSGID=yes
LockPersonality=yes
UMask=0077
# El CLI de Claude no debe autoactualizarse desde dentro del encierro (~/.local es de solo lectura).
Environment=DISABLE_AUTOUPDATER=1

# Credenciales y datos privados: ni lectura ni escritura.
InaccessiblePaths=-%h/.ssh -%h/.gnupg -%h/.local/share/keyrings -%h/.password-store
InaccessiblePaths=-%h/.mozilla -%h/.config/google-chrome -%h/.config/chromium -%h/.config/BraveSoftware
InaccessiblePaths=-%h/.config/vivaldi -%h/.config/microsoft-edge -%h/.config/opera
InaccessiblePaths=-%h/CyberLab
InaccessiblePaths=-%h/.aws -%h/.config/gh -%h/.git-credentials -%h/.netrc -%h/.docker -%h/.kube
InaccessiblePaths=-%h/Proyectos/Jarvis/.env
# Refuerzo a: los secretos de face (token del gateway, del HUD, claves de voz) no son legibles desde aquí.
InaccessiblePaths=-%h/.config/jarvis

# Refuerzo b: sin persistencia ni autodesbloqueo (unidades, autostart, escritorio, shells, binarios, el repo).
ReadOnlyPaths=-%h/.config/systemd -%h/.local/share/systemd -%h/.config/autostart -%h/.local/share/applications
ReadOnlyPaths=-%h/.config/hypr -%h/.config/caelestia -%h/.config/environment.d -%h/.pam_environment
ReadOnlyPaths=-%h/.config/fish -%h/.bashrc -%h/.bash_profile -%h/.profile -%h/.zshrc
ReadOnlyPaths=-%h/.config/wireplumber -%h/.config/pipewire
ReadOnlyPaths=-%h/.local/bin -%h/.local/lib/node_modules -%h/.local/share/claude
ReadOnlyPaths=-%h/Proyectos/Jarvis

# Refuerzo d: el agente no puede reescribir su config, sus aprobaciones ni su personalidad.
# ~/.openclaw de solo lectura (openclaw.json incluido: solo lo cambia el CLI desde fuera del encierro),
# salvo el estado que el gateway necesita. Las aprobaciones de exec viven en state/openclaw.sqlite: el agente
# no tiene herramienta que pueda escribirla (tool gateway denegada, fs solo en el workspace, exec por allowlist).
ReadOnlyPaths=%h/.openclaw
ReadWritePaths=-%h/.openclaw/state -%h/.openclaw/agents -%h/.openclaw/tmp -%h/.openclaw/locks -%h/.openclaw/media
ReadWritePaths=-%h/.openclaw/client -%h/.openclaw/control -%h/.openclaw/migration -%h/.openclaw/plugin-skills
ReadWritePaths=-%h/.openclaw/workspace -%h/.openclaw/workspace-jarvis
# Dentro del workspace (refuerzo c), personalidad y skills son de solo lectura (las pone sync-brain.sh).
ReadOnlyPaths=-%h/.openclaw/workspace-jarvis/AGENTS.md -%h/.openclaw/workspace-jarvis/SOUL.md
ReadOnlyPaths=-%h/.openclaw/workspace-jarvis/IDENTITY.md -%h/.openclaw/workspace-jarvis/USER.md
ReadOnlyPaths=-%h/.openclaw/workspace-jarvis/skills
