# JARVIS: ydotoold necesita la ACL de /dev/uinput, que logind (uaccess) concede al iniciar sesión en el asiento.
# Con linger arrancaba antes → "Permission denied". Se arranca con la sesión gráfica (install-face.sh lo quita de
# default.target y lo engancha a graphical-session.target) y, por si acaso, reintenta sin límite cada 2 s.
[Unit]
After=graphical-session.target
PartOf=graphical-session.target
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=2
