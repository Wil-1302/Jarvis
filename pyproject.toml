[project]
name = "jarvis-wil"
version = "0.1.0"
description = "JARVIS-WIL: asistente personal de voz para Windows 11"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Wil" }]
dependencies = [
    "faster-whisper>=1.2.1",
    "httpx>=0.28",
    "numpy>=2.5.3",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9,<10",
    "piper-tts>=1.8.0",
    "pydantic-settings>=2.10",
    "sounddevice>=0.5.6",
]

[project.scripts]
jarvis = "app.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
# JARVIS-WIL solo se ejecuta en Windows; evita resolver dependencias de Linux
# (p. ej. tflite-runtime de openwakeword, sin wheels para Python 3.12).
environments = ["sys_platform == 'win32'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: tests that need real local services or models (Ollama, git, network, GPU)",
    "hardware: tests that need a real sound card (skipped automatically when missing)",
]

# ruff no se instala: Smart App Control bloquea su binario (sin firmar).
# Se mantiene la configuración para cuando pueda usarse (p. ej. en CI).
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
