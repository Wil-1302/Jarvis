[project]
name = "jarvis-wil"
version = "0.1.0"
description = "JARVIS-WIL: asistente personal de voz para Windows 11"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Wil" }]
dependencies = [
    "httpx>=0.28",
    "pydantic-settings>=2.10",
]

[project.scripts]
jarvis = "app.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: tests that need real local services (Ollama, git, network)",
]

# ruff no se instala: Smart App Control bloquea su binario (sin firmar).
# Se mantiene la configuración para cuando pueda usarse (p. ej. en CI).
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
