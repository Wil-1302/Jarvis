# JARVIS face — config (sin secretos: el token del gateway y el del HUD viven en ../.env, permisos 600).
conversacion:
  # Activación: el nombre "Jarvis" (y variantes: yarvis, harvis, charvis…) al inicio de la frase, o Super+J.
  fin_frase: 0.45            # s de silencio que cierran una frase (VAD Silero); si queda a medias, ver espera_incompleta
  espera_incompleta: 1.5     # frase a medias ("y…", "pero…", "de…"): s que se espera su continuación (D-024)
  sordera_tras_cierre: 2.0   # s sin escuchar tras despedirse (D-022)
  debug: true               # traza de VAD en el journal (duraciones, nunca el contenido)
  silencio_fin: 10           # s sin hablar que devuelven a espera tras responder
hablante:
  # D-015 apagada (D-021): cualquier persona puede hablarle. Código conservado para, quizá, autorizar acciones delicadas.
  activo: false
audio:
  # Micrófono del portátil (DMIC del ALC257 vía HDA). NUNCA el de los audífonos BT: abrirlo los pasa a HFP.
  # Si el nodo no existe, WirePlumber usa la fuente por defecto.
  mic_target: alsa_input.pci-0000_05_00.6.analog-stereo
  # Qué es cada salida de audio, a mano (manda sobre la detección automática). Vale el nombre visible («Alaxe»), el del
  # nodo (bluez_output.…) o la dirección Bluetooth. Parlante = suena en la sala → filtro del PC activo y sin
  # interrupción por voz; audífonos = no llega al micrófono → sin filtro. El Alaxe se anuncia como «headset».
  parlantes: [Alaxe]
  audifonos: []
  # D-021: filtro del audio del PROPIO PC (vídeos, música, llamadas y la voz de JARVIS): se cancela del micrófono con
  # WebRTC AEC3 usando como referencia el monitor de la salida por defecto. Con audífonos no hace falta y se salta.
  filtro_pc: off             # auto | off. OFF hasta la sesión de audio (D-027): tras converger con música, AEC3 en vivo
                             # suprimía también la voz del señor (−48 → −61 dBFS con el parlante en silencio)
  stt_fuente: limpio         # limpio | crudo: qué audio transcribe Whisper (la detección siempre va sobre el limpio)
  barge_in: auto             # interrumpirle hablando: auto = solo con audífonos (con parlantes, apagada hasta la sesión de audio)
  barge_in_umbral: 0.7       # prob. de voz (VAD Silero) que cuenta como interrupción
  barge_in_min_voz: 0.12     # s de voz seguida antes de cortarle (objetivo: callarse en < 0,3 s)
  ducking: 0.2               # los demás sonidos bajan al 20 % de su volumen mientras JARVIS atiende
stt:
  model: large-v3-turbo      # mejor WER en español en la prueba de JARVIS-WIL (22 %, 0,30 s)
  device: cuda               # si falla, stt.py cae a CPU int8 solo
  compute_type: float16
  beam_size: 1               # 1 = ~0,4 s por frase en la RTX 4050
  language: es
  prompt: "Jarvis, Spotify, YouTube, Chrome, LibreOffice, Writer, Steam."
  # D-027: el vocabulario privado (88 artistas + apps) estropeaba el nombre («Y ya, Rauw Is…»): apagado; prompt fijo.
  vocabulario: false
llm:
  active_brain: auto
  openclaw:
    base_url: http://127.0.0.1:18789/v1
    agent: openclaw/jarvis
    user: face:jarvis        # sesión estable en OpenClaw (el historial vive allí)
    timeout: 180
    model: null              # cerebro elegido por voz; null = primary_model
    primary_model: anthropic/claude-sonnet-5-5   # = agents.defaults.model.primary (doctor.sh lo comprueba)
    backup_model: openai/gpt-5.6-terra
  enrutado:                  # D-017: charla → GPT (ahorra cuota de Claude), trabajo → Claude. ~+1,7 s en la charla
    activo: true
    charla: openai/gpt-5.6-terra
    trabajo: anthropic/claude-sonnet-5-5
  brains:                    # cambio de cerebro (x-openclaw-model); Bloque 8
    auto:   {label: "Automático (Sonnet → GPT)", model: null}
    claude: {label: "Claude Sonnet 5.5", model: anthropic/claude-sonnet-5-5}
    opus:   {label: "Claude Opus 5.5 (más lento)", model: anthropic/claude-opus-5-5}
    gpt:    {label: "ChatGPT (GPT-5.6 Terra)", model: openai/gpt-5.6-terra}
tts:
  # D-012: Edge TTS (Jorge, es-MX) es un servicio NO oficial: el texto de cada respuesta sale a Microsoft.
  # Si Edge falla o no hay internet → Piper local (queda en el journal como "[Voz] … falló; respaldo …").
  # Plan B preparado: engine: azure (oficial, misma voz) con AZURE_SPEECH_KEY/REGION en secrets.env.
  engine: edge               # edge | azure | piper | kokoro
  cooldown: 60               # s con Piper tras un fallo antes de reintentar Edge
  edge:
    voice: es-MX-JorgeNeural
    rate: "-8%"              # formal y tranquilo, sin prisas
    pitch: "-2Hz"
    timeout: 4               # s; si no llega el audio, respaldo
  azure:
    voice: es-MX-JorgeNeural # mismos rate/pitch que edge salvo que se indiquen aquí
  piper:
    model: ~/.local/share/jarvis/piper/es_MX-claude-high.onnx   # es_MX, masculina: la que mejor casa con Jorge
    length_scale: 1.1
  # Kokoro (antigua voz): lang_code e, voice em_alex
  lang_code: e
  voice: em_alex
  speed: 1.0
hud:
  port: 7860
  open_browser: true
